<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dental Case Board</title>
<!-- Home-screen app (iPad/iPhone "Add to Home Screen") -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dental Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1716" media="(prefers-color-scheme: dark)">
<style>
:root{
  --ground:#F3F6F6; --surface:#FFFFFF; --sunk:#E8EEEE; --line:#D5DEDE;
  --ink:#152221; --ink-2:#4A5A59; --ink-3:#7A8A89;
  --accent:#A83E63; --accent-soft:#F6E4EA; --on-accent:#FFFFFF;
  --ok:#2E7D5B; --ok-soft:#E0F1E8; --warn:#A86A12; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE3E1;
  --na:#9AA7A6;
  --display:ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1716; --surface:#172221; --sunk:#1F2C2B; --line:#2C3B3A;
    --ink:#E6EEED; --ink-2:#A9B8B7; --ink-3:#7A8B8A;
    --accent:#E27C9E; --accent-soft:#3A2230; --on-accent:#1A0C12;
    --ok:#6BC69A; --ok-soft:#18332A; --warn:#E3A650; --warn-soft:#3A2C16; --bad:#F08A82; --bad-soft:#3D1D1B; --na:#5E6D6C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1716; --surface:#172221; --sunk:#1F2C2B; --line:#2C3B3A;
  --ink:#E6EEED; --ink-2:#A9B8B7; --ink-3:#7A8B8A;
  --accent:#E27C9E; --accent-soft:#3A2230; --on-accent:#1A0C12;
  --ok:#6BC69A; --ok-soft:#18332A; --warn:#E3A650; --warn-soft:#3A2C16; --bad:#F08A82; --bad-soft:#3D1D1B; --na:#5E6D6C;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--body);}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font:700 28px/1.1 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--ink-2);margin-top:4px;font-size:13px}
.tally{display:flex;gap:18px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}
.tally span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.tally .hot b{color:var(--bad)}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}

.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)} .grid.detail-open .listcol{display:none} .grid:not(.detail-open) .detailcol{display:none}}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:0;background:transparent;padding:5px 10px;border-radius:999px;color:var(--ink-2);font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.filters .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}

.newform{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.newform .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:6px 8px;width:100%}
.newform .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px 4px;background:var(--sunk);border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.case{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.day + .case{border-top:0}
.case:hover{background:var(--sunk)}
.case[aria-current="true"]{background:var(--accent-soft)}
.case .nm{font-weight:600;font-size:15px}
.case .meta{grid-column:1/2;color:var(--ink-2);font-size:12px}
.case .right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bars{display:flex;gap:3px}
.bars i{display:block;width:20px;height:6px;border-radius:2px;background:var(--sunk);position:relative;overflow:hidden}
.bars i::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--ok)}
.bars i.late::after{background:var(--bad)}
.bars i.late{background:var(--bad-soft)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soft{background:var(--sunk);color:var(--ink-2)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.postponed{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.task.is-skip label>span:first-child{color:var(--na)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.back{display:none;margin-bottom:10px}
@media (max-width:820px){.back{display:inline-block}}
.dhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px}
.dhead h2{font:700 24px/1.15 var(--display);margin:0}
.dhead .who{color:var(--ink-2);margin-top:2px}
.stamp{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}

.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px;align-items:start}
@media (max-width:620px){.stages{grid-template-columns:minmax(0,1fr)}.stage.span{grid-row:auto}}
.hint{font-size:11px;color:var(--warn)}
.stage:last-child:nth-child(odd){grid-column:1/-1}
.stage{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;background:var(--sunk);font:600 14px/1.3 var(--body)}
.stage h3 small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-2)}
.stage.late h3{background:var(--bad-soft)}
.stage.late h3 small{color:var(--bad)}
.stage.done h3{background:var(--ok-soft)}
.stage.done h3 small{color:var(--ok)}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 12px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--ok)}
.task label{cursor:pointer}
.task .when.blocked{color:var(--bad)}
.task .when{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.task.is-done label>span:first-child{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task.is-na label>span:first-child{color:var(--na);font-style:italic}
.nabtn{border:1px solid var(--line);background:transparent;border-radius:4px;font-size:10px;letter-spacing:.05em;padding:1px 6px;color:var(--ink-3)}
.bookrow{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.task .bookrow input{width:auto;height:auto;margin:0;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:3px 6px;font-size:13px;min-width:0}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.nabtn[aria-pressed="true"]{background:var(--na);color:var(--surface);border-color:var(--na)}
.notes{margin-top:16px}
.notes textarea{min-height:80px;resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.foot .stamp{color:var(--ink-3)}
.placeholder{color:var(--ink-3);text-align:center;padding:60px 20px}
@media (prefers-reduced-motion:no-preference){.case,.btn{transition:background .12s,border-color .12s}}
.topright{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
#editBtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tag{font-style:normal;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-left:4px}
.addrow{display:flex;gap:6px;padding:7px 12px;border-top:1px dashed var(--line)}
.addrow input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px}
.addrow input:hover,.addrow input:focus{border-color:var(--line);background:var(--ground)}
.estages{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.estage{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.estage>.field{width:100%;max-width:340px;margin-bottom:4px}
.estage>.field input{font-weight:600}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center;width:100%}
.elabel{border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:6px 8px;width:100%}
.edue{display:flex;align-items:center;gap:4px}
.edue input{width:58px;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.edue small{color:var(--ink-3);font-size:11px}
.moves{display:flex;gap:2px}
.iconbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.elinks{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.elinks input{border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:5px 8px;width:100%;min-width:0;font-size:12px}
@media (max-width:560px){.elinks{grid-template-columns:1fr}}
.elinks .edesk{grid-column:1/-1;display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-2)}
.elinks .edesk input{width:auto;margin:1px 0 0}
.elinks .fine{grid-column:1/-1}
.elinks .fine.bad{color:var(--bad)}
.tlinkrow{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:10px;font-size:12px}
.tlinkrow a{color:var(--accent);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:30px;padding:0;color:var(--ink-2)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.del:hover{color:var(--bad);border-color:var(--bad)}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.topright .btn{align-self:flex-end}
#syncBtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.syncstate{font-size:11px;margin-left:4px;color:var(--ink-3)}
.syncstate.ok{color:var(--ok)} .syncstate.warn{color:var(--warn)} .syncstate.bad{color:var(--bad)}
#syncBtn[aria-pressed="true"] .syncstate{color:inherit;opacity:.8}
.msg{margin-top:14px;padding:9px 12px;border-radius:8px;background:var(--sunk);font-size:13px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.bad{background:var(--bad-soft);color:var(--bad)}
.syncactions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.fine{color:var(--ink-3);font-size:12px;margin:8px 0}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:8px}
.tokrow{display:flex;gap:6px;flex-wrap:wrap}
.tokrow input{flex:1;min-width:180px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cgrid>div{display:flex;flex-direction:column;gap:3px;background:var(--sunk);border-radius:8px;padding:10px}
.cgrid span{font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.cgrid .btn{margin-top:6px;align-self:flex-start}
.toolbar{flex-wrap:wrap}
.prows{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:20px 64px minmax(0,1fr);gap:4px 6px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.prow.dup{opacity:.55}
.ptime{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pclient{font-weight:600;cursor:pointer}
.pfields{grid-column:2/-1;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px}
.pfields input{grid-column:1/-1}
.toolbar .search{flex:1 1 100%;order:3}
.toolbar .btn{flex:1 1 auto}
.pfields input,.pfields select,#p-text{border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:5px 7px;width:100%;min-width:0;font-size:13px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.fine{color:var(--ink-3);font-size:12px}
.task.ask{grid-template-columns:22px 1fr auto;align-items:center}
.askmark{width:17px;height:17px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 11px/17px var(--body);text-align:center}
.task.ask.is-answered .askmark{background:var(--ok-soft);color:var(--ok)}
.yn{display:flex;gap:4px}
.yn .nabtn{font-size:11px;padding:2px 9px}
.yn .nabtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Dental Case Board</h1>
      <div class="sub">Every dental patient, exam through next-day review — nothing left unchecked.</div>
    </div>
    <div class="topright"><div class="tally" id="tally"></div><button type="button" class="btn small" id="syncBtn" aria-pressed="false">Sync <span id="syncState" class="syncstate"></span></button><button type="button" class="btn small" id="editBtn" aria-pressed="false">Edit checklist</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <div class="grid" id="grid">
    <section class="listcol">
      <div class="toolbar">
        <input class="search" id="q" type="search" placeholder="Search patient or client" aria-label="Search">
        <button class="btn primary" id="newBtn">+ New case</button>
        <button class="btn" id="pasteBtn" type="button">Paste schedule</button>
      </div>
      <form class="newform" id="newForm" hidden>
        <div class="field"><label for="f-name">Patient</label><input id="f-name" required placeholder="Biscuit"></div>
        <div class="field"><label for="f-species">Species</label><select id="f-species"><option>Canine</option><option>Feline</option><option>Other</option></select></div>
        <div class="field"><label for="f-client">Client</label><input id="f-client" placeholder="Last name"></div>
        <div class="field"><label for="f-date">Procedure date</label><input id="f-date" type="date" required></div>
        <div class="field full"><label for="f-proc">Procedure</label><select id="f-proc"></select></div>
        <div class="actions"><button type="button" class="btn" id="cancelNew">Cancel</button><button type="submit" class="btn primary">Add case</button></div>
      </form>
      <form class="newform" id="pasteForm" hidden>
        <div class="field"><label for="p-date">Appointment date</label><input id="p-date" type="date" required></div>
        <div class="field full"><label for="p-text">Paste from Square</label><textarea id="p-text" rows="3" placeholder="10:20 AM Client name 10:40 AM Client name"></textarea></div>
        <div class="full prows" id="p-rows"></div>
        <div class="actions"><button type="button" class="btn" id="cancelPaste">Cancel</button><button type="submit" class="btn primary" id="pasteAdd" disabled>Add cases</button></div>
      </form>
      <div class="filters" id="filters" role="group" aria-label="Filter cases"></div>
      <div class="list" id="list"></div>
    </section>
    <section class="detailcol" id="detail"></section>
  </div>
</div>


<script>
"use strict";
/* Dental Case Board — single-file, offline-capable.
   No patient data lives in this file. Cases are kept in this browser (localStorage)
   and optionally synced to one JSON file in a PRIVATE GitHub repo via the Contents API. */

const APP_ID = "dental-case-board";
const K_DATA = "dcb-data-v1", K_SYNC = "dcb-sync-v1", K_TOKEN = "dcb-token-v1";

// Default checklist (doctor steps). due = days after the procedure; overdue once that day ends.
// `since` (YYYY-MM-DD) limits a later-added task to cases on/after that date.
// `requires` blocks checking a task until another task is done or N/A.
const DEFAULT_STAGES = [
  { key:'proc', name:'Exam & procedure', tasks:[
    {id:'exam',label:'Exam; plan, diagnostics & estimate discussed with client',due:0},
    {id:'anes',label:'Anesthesia protocol written & handed off',due:0},
    {id:'radreview',label:'Dental radiographs reviewed',due:0},
    {id:'blocks',label:'Dental nerve blocks (if needed)',due:0},
    {id:'ext',label:'Extractions / procedures (≤ 1 h)',due:0},
    {id:'biopsyq',label:'Biopsy / mass removal done?',due:0,ask:true,since:'2026-09-25'},
  ]},
  { key:'dis', name:'Discharge', tasks:[
    {id:'update',label:'Client update call; pick-up time set',due:0},
    {id:'gohome',label:'Take-home medications ready',due:0},
    {id:'pickup',label:'Picked up',due:0,requires:'gohome'},
  ]},
  { key:'rec', name:'Records', tasks:[
    {id:'soap',label:'SOAP completed',due:0},
    {id:'surgreport',label:'Dental surgery report written (if needed)',due:0},
  ]},
  { key:'histo', name:'Histopathology', tasks:[
    {id:'historeq',label:'Histopathology requisition submitted',due:0,if:'biopsyq',since:'2026-09-25'},
    {id:'historesult',label:'Histopathology results checked',due:7,if:'biopsyq',since:'2026-09-25'},
  ]},
  { key:'rev', name:'Next-day review', tasks:[
    {id:'record',label:'Medical record complete',due:1},
    {id:'rabies',label:'Rabies due date entered in PMS',due:1},
    {id:'recheck',label:'Next dental reminder (1–2 yr) entered in PMS',due:1},
    {id:'controlled',label:'Controlled substances checked',due:1},
  ]},
];
const PROCS=['Same-day dental','Extractions only (follow-up)'];

// ---------- storage ----------
function lsGet(k){try{return localStorage.getItem(k);}catch(_){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(_){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(_){}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function emptyData(){return {version:1,app:APP_ID,checklist:null,cases:{},sync:{rev:0,modified:null,device:null}};}
function loadData(){try{const d=JSON.parse(lsGet(K_DATA)||'null');if(d&&d.app===APP_ID)return d;}catch(_){}return emptyData();}
function loadSyncCfg(){
  let c={};try{c=JSON.parse(lsGet(K_SYNC)||'{}')||{};}catch(_){}
  return Object.assign({owner:'jjdiaz9',repo:'cibasecrets',branch:'main',path:'dental-case-board/cases.json',baseRev:0,sha:null,autoSync:true,device:null,lastSync:null},c);
}
let data=loadData(), cfg=loadSyncCfg();
if(!cfg.device){cfg.device=deviceLabel();saveCfg();}
let storageOk=lsSet('dcb-probe','1'); lsDel('dcb-probe');
function saveCfg(){lsSet(K_SYNC,JSON.stringify(cfg));}
function getToken(){return lsGet(K_TOKEN)||'';}
function deviceLabel(){
  const ua=navigator.userAgent||''; const kind=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'Browser';
  return kind+' · '+Math.random().toString(36).slice(2,5);
}
function bodyOf(d){return JSON.stringify({checklist:d.checklist,checklistV:d.checklistV,checklistAt:d.checklistAt,cases:d.cases,deleted:d.deleted});}
let lastBody=bodyOf(data);

// ---------- change stamps (for merging devices) ----------
// Every commit stamps what changed: case.updatedAt, each task state's `m`, checklistAt, and
// deleted[id] for removed cases. Merging then keeps the newest version of each case and each task.
let snap=null;
function taskKey(st){const {m,...r}=st||{};return JSON.stringify(r);}
function caseKey(c){const {updatedAt,tasks,...r}=c; return JSON.stringify(r)+'|'+Object.keys(tasks||{}).sort().map(k=>k+taskKey(tasks[k])).join();}
function takeSnap(){
  snap={cases:{},tasks:{},checklist:JSON.stringify(data.checklist||null)};
  for(const [id,c] of Object.entries(data.cases)){snap.cases[id]=caseKey(c);snap.tasks[id]={};for(const [k,st] of Object.entries(c.tasks||{}))snap.tasks[id][k]=taskKey(st);}
}
function stamp(){
  const now=new Date().toISOString(); data.deleted=data.deleted||{};
  for(const [id,c] of Object.entries(data.cases)){
    if(snap.cases[id]===caseKey(c)) continue;
    c.updatedAt=now; delete data.deleted[id];
    const old=snap.tasks[id]||{}; for(const [k,st] of Object.entries(c.tasks||{})) if(old[k]!==taskKey(st)) c.tasks[k]={...st,m:now};
  }
  for(const id in snap.cases) if(!data.cases[id]) data.deleted[id]=now;
  if(JSON.stringify(data.checklist||null)!==snap.checklist) data.checklistAt=now;
  takeSnap();
}
takeSnap();
// Combine this device's data with GitHub's: newest case wins, but task ticks from both are kept.
function mergeData(L,R){
  const out={...R,cases:{},deleted:{...(R.deleted||{})}};
  for(const [id,t] of Object.entries(L.deleted||{})) if(!(out.deleted[id]>=t)) out.deleted[id]=t;
  const lc=L.cases||{}, rc=R.cases||{};
  for(const id of new Set([...Object.keys(lc),...Object.keys(rc)])){
    const l=lc[id], r=rc[id]; let c;
    if(l&&r){
      const [a,b]=(l.updatedAt||'')>=(r.updatedAt||'')?[l,r]:[r,l];
      c=clone(a); const tasks={...(b.tasks||{})};
      for(const [k,st] of Object.entries(a.tasks||{})) if(!(tasks[k]&&(tasks[k].m||'')>(st.m||''))) tasks[k]=st;
      c.tasks=clone(tasks);
    } else c=clone(l||r);
    const del=out.deleted[id];
    if(del&&del>=(c.updatedAt||'')) continue;   // deleted on one device after its last edit
    if(del) delete out.deleted[id];
    out.cases[id]=c;
  }
  if((L.checklistAt||'')>(R.checklistAt||'')){out.checklist=L.checklist;out.checklistAt=L.checklistAt;}
  out.checklistV=Math.max(L.checklistV||0,R.checklistV||0)||undefined;
  return out;
}

// Persist; advance rev only when the stored content actually changed.
function commit(){
  stamp();
  const b=bodyOf(data);
  if(b!==lastBody){
    data.sync={rev:(data.sync&&data.sync.rev||0)+1,modified:new Date().toISOString(),device:cfg.device};
    lastBody=b;
    if(!lsSet(K_DATA,JSON.stringify(data))) showBanner('This browser is not saving (private window or storage blocked). Push to GitHub before closing.','bad');
    scheduleAutoPush();
  }
  render();
}
function pending(){return (data.sync.rev||0)>(cfg.baseRev||0);}
function stages(){if(!(data.checklist&&data.checklist.length))return DEFAULT_STAGES; if((data.checklistV||0)<2){data.checklist=withBuiltins(data.checklist);data.checklistV=2;} return data.checklist;}

// ---------- UI state ----------
let selected=null, filter='active', query='', confirmDel=false;
let view='case'; // 'case' | 'editor' | 'sync'
let draft=null, confirmReset=false, syncMsg=null, busy=false, confirmClear=false, syncErr=null;
const $=id=>document.getElementById(id);
function newId(p){return (p||'t')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtStamp(iso){if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dueWord(n){return n===0?'same day':n===1?'next day':`day ${n}`;}
function shortProc(p){return (p||'').replace(/ \(\$.*\)/,'');}

// ---------- checklist logic ----------
function taskState(c,id){return (c.tasks&&c.tasks[id])||{};}
function isClosed(t){return !!(t.done||t.na);}
// Add the biopsy question + histopathology section to checklists saved before they existed.
function withBuiltins(st){
  const out=clone(st), ids=new Set(out.flatMap(x=>x.tasks.map(t=>t.id)));
  const def=id=>DEFAULT_STAGES.flatMap(x=>x.tasks).find(t=>t.id===id);
  if(!ids.has('biopsyq')){const tgt=out.find(x=>x.key==='proc')||out[0]; if(tgt) tgt.tasks.push(clone(def('biopsyq')));}
  if(!ids.has('historeq')&&!ids.has('historesult')){const h=clone(DEFAULT_STAGES.find(x=>x.key==='histo')); const ri=out.findIndex(x=>x.key==='rev'); if(ri>=0) out.splice(ri,0,h); else out.push(h);}
  return out;
}
function tasksFor(c,s){
  const base=s.tasks.filter(t=>(!t.since||!c.date||c.date>=t.since)&&(!t.if||taskState(c,t.if).answer==='yes'));
  const extra=((c.extra||{})[s.key]||[]).map(t=>({...t,extra:true}));
  return base.concat(extra);
}
function findTask(c,id){for(const s of stages()){const t=tasksFor(c,s).find(x=>x.id===id);if(t)return t;}return null;}
function hasTask(c,id){return !!findTask(c,id);}
function analyze(c){
  const today=todayStr(); let done=0,total=0; const st=stages().map(s=>{
    let d=0, late=0; const ts=tasksFor(c,s);
    ts.forEach(t=>{if(isClosed(taskState(c,t.id))) d++; else if(!c.postponed&&c.date&&today>addDays(c.date,+t.due||0)) late++;});
    done+=d; total+=ts.length; return {done:d,total:ts.length,late,maxDue:Math.max(0,...ts.map(t=>+t.due||0))};
  });
  const late=st.reduce((n,s)=>n+s.late,0);
  // Postponed (not fit for anesthesia): what was done stays checked, the rest is not needed.
  return {stages:st,done,total,late,postponed:!!c.postponed,complete:!!c.postponed||(total>0&&done===total)};
}
function pillFor(a,long){return a.postponed?'<span class="pill warn">Postponed</span>':a.complete?'<span class="pill ok">Complete</span>':a.late?`<span class="pill bad">${a.late} overdue</span>`:`<span class="pill soft">${a.done}${long?' of ':'/'}${a.total}${long?' done':''}</span>`;}
function allCases(){return Object.entries(data.cases).map(([id,c])=>({...c,id}));}
// Open list: everything unfinished, except booked follow-ups before their day (they sit in Upcoming)
function isOpen(c,a){return !a.complete && !(c.followUpOf && c.date>todayStr());}
function filtered(){
  const today=todayStr(), q=query.trim().toLowerCase();
  return allCases().filter(c=>{
    if(q && !((c.patient||'')+' '+(c.client||'')).toLowerCase().includes(q)) return false;
    const a=analyze(c);
    switch(filter){
      case 'attention': return !a.complete && a.late>0;
      case 'today': return c.date===today;
      case 'upcoming': return c.date>today;
      case 'complete': return a.complete;
      default: return isOpen(c,a);
    }
  }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (a.time||'99').localeCompare(b.time||'99') || (a.patient||'').localeCompare(b.patient||''));  // newest date first; same day by appointment time
}

// ---------- render ----------
function renderTally(){
  const all=allCases().map(c=>[c,analyze(c)]), today=todayStr();
  const active=all.filter(([c,a])=>isOpen(c,a)).length;
  const att=all.filter(([c,a])=>!a.complete&&a.late>0).length;
  const td=all.filter(([c])=>c.date===today).length;
  $('tally').innerHTML=`<div><b>${td}</b><span>Today</span></div><div class="${att?'hot':''}"><b>${att}</b><span>Overdue tasks</span></div><div><b>${active}</b><span>Open cases</span></div>`;
  const counts={active, attention:att, today:td, upcoming:all.filter(([c])=>c.date>today).length, complete:all.filter(([c,a])=>a.complete).length};
  const F=[['active','Open'],['attention','Overdue'],['today','Today'],['upcoming','Upcoming'],['complete','Completed']];
  $('filters').innerHTML=F.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${filter===k}">${l}<span class="n">${counts[k]}</span></button>`).join('');
  $('editBtn').setAttribute('aria-pressed',view==='editor');
  $('syncBtn').setAttribute('aria-pressed',view==='sync');
  const tok=!!getToken();
  $('syncState').textContent= !tok?'Not syncing' : busy?'Syncing…' : syncErr?(syncErr==='offline'?'Offline — will retry':'Sync problem') : pending()?`${(data.sync.rev||0)-(cfg.baseRev||0)} change${(data.sync.rev-cfg.baseRev)===1?'':'s'} not pushed` : cfg.lastSync?'Synced '+fmtStamp(cfg.lastSync):'Ready to pull';
  $('syncState').className='syncstate '+(!tok||busy?'':syncErr?'bad':pending()?'warn':'ok');
}
function renderList(){
  const rows=filtered(), today=todayStr();
  if(!rows.length){
    $('list').innerHTML=Object.keys(data.cases).length?`<div class="empty">No cases match this view.</div>`:
      `<div class="empty">No cases yet — add your first dental patient.<br><button type="button" class="btn small" id="loadEx" style="margin-top:10px">Load 3 fake example cases</button></div>`;
    return;
  }
  let html='', lastDay=null;
  rows.forEach(c=>{
    if(c.date!==lastDay){lastDay=c.date;html+=`<div class="day">${c.date===today?'Today · ':''}${fmtDate(c.date)}</div>`;}
    const a=analyze(c);
    const bars=a.stages.map((s,i)=>!s.total?'':`<i class="${s.late?'late':''}" style="--p:${s.total?Math.round(s.done/s.total*100):100}%" title="${esc(stages()[i].name)}: ${s.done}/${s.total}"></i>`).join('');
    const pill=pillFor(a);
    html+=`<button type="button" class="case" data-id="${esc(c.id)}" aria-current="${view==='case'&&selected===c.id}">
      <span class="nm">${esc(c.patient)} ${c.sample?'<span class="pill ex">Example</span>':''}</span>
      <span class="meta">${c.time?fmtTime(c.time)+' · ':''}${esc(c.species||'')}${c.client?' · '+esc(c.client):''} · ${esc(shortProc(c.procedure))}</span>
      <span class="right">${pill}<span class="bars">${bars}</span></span></button>`;
  });
  $('list').innerHTML=html;
}
function renderDetail(){
  if(view==='editor'){ $('grid').classList.add('detail-open'); renderEditor(); return; }
  if(view==='sync'){ $('grid').classList.add('detail-open'); renderSync(); return; }
  const c=selected&&data.cases[selected]?{...data.cases[selected],id:selected}:null;
  $('grid').classList.toggle('detail-open',!!c);
  if(!c){$('detail').innerHTML=`<div class="detail placeholder">Select a case to see its checklist.</div>`;return;}
  const a=analyze(c);
  const st=stages().map((s,i)=>{
    const sa=a.stages[i]; const cls=sa.total&&sa.done===sa.total?'done':sa.late?'late':'';
    const lbl=sa.total&&sa.done===sa.total?'all done':sa.late?`${sa.late} overdue`:`${sa.done}/${sa.total} · by ${dueWord(sa.maxDue)}`;
    const tasks=tasksFor(c,s).map(t=>{
      const ts=taskState(c,t.id); const id='t-'+t.id;
      const reqT=!c.postponed&&t.requires&&!ts.done&&hasTask(c,t.requires)&&!isClosed(taskState(c,t.requires))?findTask(c,t.requires):null;
      const due=+t.due||0;
      const when=ts.done&&ts.at?`<span class="when">✓ ${fmtStamp(ts.at)}</span>`:ts.na?`<span class="when">not applicable</span>`:c.postponed?`<span class="when">not needed · postponed</span>`:(due>0?`<span class="when">due ${fmtDate(addDays(c.date,due))}</span>`:'');
      if(t.ask){const ans=ts.answer; return `<div class="task ask ${ans?'is-answered':''}"><span class="askmark" aria-hidden="true">?</span><span><span>${esc(t.label)}</span>${ans?`<span class="when">Answered ${ans==='yes'?'yes':'no'} · ${fmtStamp(ts.at)}</span>`:''}</span><span class="yn"><button type="button" class="nabtn" data-ask="${esc(t.id)}" data-val="yes" aria-pressed="${ans==='yes'}">Yes</button><button type="button" class="nabtn" data-ask="${esc(t.id)}" data-val="no" aria-pressed="${ans==='no'}">No</button></span></div>`;}
      const side=t.extra?`<button type="button" class="nabtn" data-rmextra="${esc(t.id)}" data-stage="${esc(s.key)}" title="Remove this task from this case">Remove</button>`:`<button type="button" class="nabtn" data-na="${esc(t.id)}" aria-pressed="${!!ts.na}" title="Mark not applicable">N/A</button>`;
      const href=officeHref((c.species==='Feline'&&t.linkCat)||t.link||'',t.desktop), web=/^https?:/i.test(href);
      const tlink=href?`<div class="tlinkrow"><a href="${esc(href)}" ${web?'target="_blank" rel="noopener noreferrer"':''}>Open ${t.linkCat?(c.species==='Feline'?'cat ':c.species==='Canine'?'dog ':''):''}link ↗</a></div>`:'';
      let book='';
      if(t.id==='recheck'&&!t.extra){
        const fu=c.followUp&&data.cases[c.followUp];
        if(fu) book=`<div class="bookrow"><span class="when">Extractions booked for ${fmtDate(fu.date)} · <button type="button" class="linkbtn" data-open="${esc(c.followUp)}">Open follow-up</button></span></div>`;
        else if(!isClosed(ts)&&!c.postponed) book=`<div class="bookrow"><span class="when">Coming back for extractions?</span><input type="date" id="bk-date" min="${todayStr()}" aria-label="Extractions appointment date"><button type="button" class="btn small" data-book="1">Book extractions</button></div>`;
      }
      return `<div class="task ${ts.done?'is-done':''} ${ts.na?'is-na':''} ${c.postponed&&!isClosed(ts)?'is-skip':''}"><input type="checkbox" id="${esc(id)}" data-task="${esc(t.id)}" ${ts.done?'checked':''} ${ts.na||reqT?'disabled':''}><label for="${esc(id)}"><span>${esc(t.label)}${t.extra?' <em class="tag">this case</em>':''}</span>${reqT?`<span class="when blocked">Finish “${esc(reqT.label)}” first</span>`:when}</label>${side}${tlink}${book}</div>`;
    }).join('');
    const add=`<div class="addrow"><input id="x-${esc(s.key)}" data-xstage="${esc(s.key)}" placeholder="Add a task for this patient" aria-label="Add a task to ${esc(s.name)} for this patient"><button type="button" class="btn small" data-addextra="${esc(s.key)}">Add</button></div>`;
    if(!tasksFor(c,s).length) return '';
    return `<div class="stage ${cls}"><h3>${esc(s.name)}<small>${lbl}</small></h3>${tasks}${add}</div>`;
  }).join('');
  const procs=PROCS.slice(); if(c.procedure && !procs.includes(c.procedure)) procs.push(c.procedure);
  const species=['Canine','Feline','Other']; if(c.species && !species.includes(c.species)) species.push(c.species);
  $('detail').innerHTML=`<div class="detail">
    <button type="button" class="btn small back" id="backBtn">← All cases</button>
    <div class="dhead"><div><h2>${esc(c.patient)}</h2><div class="who">${esc(c.species||'')}${c.client?' · '+esc(c.client)+' family':''}</div>${c.followUpOf&&data.cases[c.followUpOf]?`<div class="who">Follow-up to ${fmtDate(data.cases[c.followUpOf].date)} dental · <button type="button" class="linkbtn" data-open="${esc(c.followUpOf)}">Open original case</button></div>`:''}</div>
      <div style="text-align:right">${pillFor(a,true)}<div class="stamp" style="margin-top:6px">${fmtDate(c.date)}${c.time?' · '+fmtTime(c.time):''}</div></div></div>
    ${c.postponed?`<div class="postponed">Postponed · not fit for anesthesia · ${fmtStamp(c.postponed.at)}. Check off anything that was done; the rest isn’t needed. <button type="button" class="linkbtn" id="unpostBtn">Undo</button></div>`:''}
    <div class="info">
      <div class="field"><label for="e-patient">Patient</label><input id="e-patient" data-edit="patient" value="${esc(c.patient)}"></div>
      <div class="field"><label for="e-species">Species</label><select id="e-species" data-edit="species">${species.map(x=>`<option ${x===c.species?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label for="e-client">Client</label><input id="e-client" data-edit="client" value="${esc(c.client||'')}"></div>
      <div class="field"><label for="e-date">Procedure date</label><input id="e-date" type="date" data-edit="date" value="${esc(c.date)}"></div>
      <div class="field"><label for="e-proc">Procedure</label><select id="e-proc" data-edit="procedure">${procs.map(p=>`<option ${p===c.procedure?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    </div>
    <div class="stages">${st}</div>
    <div class="field notes"><label for="e-notes">Case notes</label><textarea id="e-notes" data-edit="notes" placeholder="Teeth extracted, complications, callback details…">${esc(c.notes||'')}</textarea></div>
    <div class="foot"><span class="stamp">Added ${fmtStamp(c.createdAt)}</span>
      <span>${confirmDel?`<span style="color:var(--ink-2);margin-right:8px">Delete this case for good?</span><button type="button" class="btn small" id="delNo">Keep</button> <button type="button" class="btn small danger" id="delYes">Delete</button>`:`${c.postponed?'':'<button type="button" class="btn small" id="postBtn" title="Patient not fit for anesthesia">Postpone procedure</button> '}<button type="button" class="btn small danger" id="delBtn">Delete case</button>`}</span></div>
  </div>`;
}

    </div></div>`;
}
function summary(d){const n=Object.keys(d.cases||{}).length;return `${n} case${n===1?'':'s'}`;}

  $('detail').innerHTML=`<div class="detail">
    <button type="button" class="btn small back" id="backBtn">← All cases</button>

// ---------- GitHub sync ----------
const b64encode=s=>{let b="";new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b);};
const b64decode=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,"")),c=>c.charCodeAt(0)));
function ghHeaders(){return {'Authorization':'Bearer '+getToken(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
function repoUrl(){return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;}
function fileUrl(){return repoUrl()+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/');}
class SyncError extends Error{constructor(msg,status){super(msg);this.status=status;}}
async function ghMessage(r){try{const j=await r.json();return j&&j.message||'';}catch(_){return '';}}
async function explain403(r){
  const msg=await ghMessage(r);
  if(r.headers.get('x-ratelimit-remaining')==='0'||/rate limit/i.test(msg)){const reset=+r.headers.get('x-ratelimit-reset');return 'GitHub rate limit reached'+(reset?` — try again after ${new Date(reset*1000).toLocaleTimeString()}`:'')+'.';}

}
// 404 is ambiguous: find out whether the repo, the branch, or just the file is missing.
async function explain404(){
  const r=await fetch(repoUrl(),{headers:ghHeaders()});
  if(r.status===404) return {kind:'repo',text:`Can't see ${cfg.owner}/${cfg.repo}. Check the owner and repo name, and that the token was granted access to that repository.`};
  if(r.status===401) return {kind:'auth',text:'GitHub rejected the token (expired, revoked or mistyped). Save a new one.'};
  const b=await fetch(repoUrl()+'/branches/'+encodeURIComponent(cfg.branch),{headers:ghHeaders()});
  if(b.status===404){
    let names=[];try{const l=await fetch(repoUrl()+'/branches?per_page=20',{headers:ghHeaders()});if(l.ok)names=(await l.json()).map(x=>x.name);}catch(_){}
    return {kind:'branch',text:`Branch "${cfg.branch}" doesn't exist in ${cfg.repo}.${names.length?' Branches: '+names.join(', ')+'.':''}`};
  }
  return {kind:'file',text:''};

async function readRemote(){
  const r=await fetch(fileUrl()+'?ref='+encodeURIComponent(cfg.branch),{headers:ghHeaders(),cache:'no-store'});
  if(r.ok){

    try{remote=JSON.parse(b64decode(j.content));}catch(_){throw new SyncError(`${cfg.path} in ${cfg.repo} isn't valid JSON — it may have been edited by hand.`);}
    if(!remote||remote.app!==APP_ID) throw new SyncError(`${cfg.path} isn't a Dental Case Board file. Pick a different file path so nothing else gets overwritten.`);
    return {remote,sha:j.sha};
  }
  if(r.status===404){const w=await explain404();if(w.kind==='file')return {remote:null,sha:null};throw new SyncError(w.text,404);}
  if(r.status===401) throw new SyncError('GitHub rejected the token (expired, revoked or mistyped). Save a new one.',401);
  if(r.status===403) throw new SyncError(await explain403(r),403);

async function putRemote(obj,sha){
  const body={message:`Dental Case Board: rev ${obj.sync.rev} from ${cfg.device}`,content:b64encode(JSON.stringify(obj,null,1)),branch:cfg.branch};

  if(r.ok){const j=await r.json();return j.content&&j.content.sha;}

  if(r.status===404){const w=await explain404();throw new SyncError(w.text||`Couldn't write ${cfg.path}.`,404);}

// Push the merged copy; GitHub answers 409 if another device pushed in between, then we merge again.
async function runSync(kind,auto){

        } else if(pending()&&(kind==='push'||auto)){

        } else {

  const c=data.cases[selected], date=$('bk-date')&&$('bk-date').value; if(!c) return;
  if(!date){$('bk-date').focus();return;}
  const id=newId('c'), now=new Date().toISOString();
  data.cases[id]={patient:c.patient,species:c.species,client:c.client,date,procedure:PROCS[1],notes:`Returning for extractions after ${fmtDate(c.date)} dental.`,tasks:{},followUpOf:selected,createdAt:now};
  c.followUp=id; deepMerge(c,{tasks:{recheck:{done:true,na:false,at:now}}});
  commit();
  showBanner(`Extractions booked for ${fmtDate(date)}. ${c.patient} will be back in the worklist that day.`,'ok');
}
function createCase(c){data.cases[newId('c')]=c;commit();}
// ---- Paste schedule (from Square's appointment list) ----
let pasteRows=[];
function to24(h,m,ap){h=+h%12;if(/p/i.test(ap))h+=12;return String(h).padStart(2,'0')+':'+m;}
function fmtTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM');}
// "10:20 AM Client Name 10:40 AM Client Name" — one per line or all run together
function parseSchedule(txt){
  const out=[], re=/(\d{1,2}):(\d{2})\s*([AaPp])\.?\s*[Mm]\.?\s+([\s\S]*?)(?=\s*\d{1,2}:\d{2}\s*[AaPp]\.?\s*[Mm]\b|$)/g; let m;
  while((m=re.exec(txt))){const client=m[4].replace(/\s+/g,' ').replace(/^[\s\-–—·,|]+|[\s\-–—·,|]+$/g,'').trim(); if(client) out.push({time:to24(m[1],m[2],m[3]),client});}
  return out;
}
function refreshPaste(){
  const date=$('p-date').value, prev=pasteRows;
  const existing=listCases().filter(c=>c.date===date);
  pasteRows=parseSchedule($('p-text').value).map((r,i)=>{
    const old=prev.find(p=>p.time===r.time&&p.client===r.client)||{};
    const dup=existing.some(c=>(c.client||'').toLowerCase()===r.client.toLowerCase()&&(!c.time||c.time===r.time));
    return {...r,dup,include:dup?false:(old.include??true),pet:old.pet||'',species:old.species||'Canine',procedure:old.procedure||PROCS[0]};
  });
  renderPasteRows();
}
function renderPasteRows(){
  const n=pasteRows.filter(r=>r.include).length;
  $('p-rows').innerHTML=!pasteRows.length?(($('p-text').value.trim())?'<div class="fine">No appointments found. Each one should start with a time like 10:20 AM.</div>':''):
    pasteRows.map((r,i)=>`<div class="prow ${r.dup?'dup':''}">
      <input type="checkbox" id="p-inc-${i}" data-p="include" data-i="${i}" ${r.include?'checked':''} ${r.dup?'disabled':''} aria-label="Include ${esc(r.client)}">
      <span class="ptime">${fmtTime(r.time)}</span>
      <label for="p-inc-${i}" class="pclient">${esc(r.client)}${r.dup?' <em class="tag">already added</em>':''}</label>
      <span class="pfields"><input id="p-pet-${i}" data-p="pet" data-i="${i}" value="${esc(r.pet)}" placeholder="Pet name" aria-label="Pet name" ${r.dup?'disabled':''}>
        <select id="p-sp-${i}" data-p="species" data-i="${i}" aria-label="Species" ${r.dup?'disabled':''}>${['Canine','Feline','Other'].map(s=>`<option ${s===r.species?'selected':''}>${s}</option>`).join('')}</select>
        <select id="p-pr-${i}" data-p="procedure" data-i="${i}" aria-label="Procedure" ${r.dup?'disabled':''}>${PROCS.map(p=>`<option ${p===r.procedure?'selected':''}>${esc(p)}</option>`).join('')}</select></span>
    </div>`).join('');
  $('pasteAdd').textContent=n?`Add ${n} case${n===1?'':'s'}`:'Add cases';
  $('pasteAdd').disabled=!n;
}
$('pasteBtn').addEventListener('click',()=>{$('newForm').hidden=true;$('pasteForm').hidden=false;$('p-date').value=$('p-date').value||todayStr();$('p-text').focus();});
$('newBtn').addEventListener('click',()=>{$('pasteForm').hidden=true;});
$('cancelPaste').addEventListener('click',()=>{$('pasteForm').hidden=true;});
$('p-text').addEventListener('input',refreshPaste);
$('p-date').addEventListener('change',refreshPaste);
$('p-rows').addEventListener('input',e=>{const t=e.target;if(!t.dataset.p)return;const r=pasteRows[+t.dataset.i];r[t.dataset.p]=t.type==='checkbox'?t.checked:t.value;if(t.type==='checkbox')renderPasteRows();});
$('p-rows').addEventListener('change',e=>{const t=e.target;if(!t.dataset.p)return;const r=pasteRows[+t.dataset.i];r[t.dataset.p]=t.type==='checkbox'?t.checked:t.value;if(t.type==='checkbox')renderPasteRows();});
$('pasteForm').addEventListener('submit',e=>{
  e.preventDefault(); const date=$('p-date').value; if(!date) return;
  const rows=pasteRows.filter(r=>r.include&&!r.dup); if(!rows.length) return;
  const now=new Date().toISOString();
  rows.forEach(r=>createCase({patient:r.pet.trim()||'Unnamed pet',species:r.species,client:r.client,date,time:r.time,procedure:r.procedure,notes:'',tasks:{},createdAt:now}));
  pasteRows=[]; $('p-text').value=''; $('p-rows').innerHTML=''; $('pasteForm').hidden=true;
  filter='active'; selected=null; render();
  showBanner(`Added ${rows.length} case${rows.length===1?'':'s'} for ${fmtDate(date)}.`,'ok');
});

// Commit a still-focused field before the page goes away.
window.addEventListener('pagehide',flushActive);
window.addEventListener('beforeunload',flushActive);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){flushActive(); if(autoOn()&&pending()) runSync('push',true);}  // push before the app is put away
  else autoSync();
});
window.addEventListener('focus',autoSync);
window.addEventListener('online',autoSync);
setInterval(autoSync,30000);
if(!storageOk) showBanner('This browser is not saving (private window or storage blocked). Push to GitHub before closing.','bad');
render();
if(autoOn()) autoSync(); else if(getToken()&&navigator.onLine!==false) runSync('pull');
</script>
